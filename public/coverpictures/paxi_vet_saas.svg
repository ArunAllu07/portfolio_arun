<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#111c2e"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glowTeal">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- Grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="720"/>
    <line x1="400" y1="0" x2="400" y2="720"/>
    <line x1="600" y1="0" x2="600" y2="720"/>
    <line x1="800" y1="0" x2="800" y2="720"/>
    <line x1="1000" y1="0" x2="1000" y2="720"/>
  </g>

  <!-- Header -->
  <rect x="40" y="30" width="1200" height="60" rx="12" fill="#142136" stroke="#253856" stroke-width="1"/>
  <circle cx="70" cy="60" r="10" fill="#14b8a6" filter="url(#glowTeal)"/>
  <text x="95" y="66" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">PAXI AI | VETERINARY SAAS & CLINIC CRM</text>
  <text x="510" y="65" fill="#64748b" font-family="sans-serif" font-size="13">Voice-AI Intake Agent · RAG Pathology Engine · Commercial Clinic Deployment</text>

  <rect x="1080" y="45" width="140" height="30" rx="15" fill="#042f2e" stroke="#0d9488" stroke-width="1"/>
  <text x="1098" y="65" fill="#5eead4" font-family="sans-serif" font-size="12" font-weight="600">Production SaaS</text>

  <!-- Metrics Cards -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="280" height="90" rx="10" fill="#132034" stroke="#223552" stroke-width="1"/>
    <text x="20" y="32" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="500">ACTIVE PET PARENTS</text>
    <text x="20" y="68" fill="#2dd4bf" font-family="sans-serif" font-size="28" font-weight="700">1,900+</text>
    <text x="135" y="65" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="600">Across 2 Clinics</text>

    <rect x="306" y="0" width="280" height="90" rx="10" fill="#132034" stroke="#223552" stroke-width="1"/>
    <text x="326" y="32" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="500">INTAKE TIME REDUCTION</text>
    <text x="326" y="68" fill="#38bdf8" font-family="sans-serif" font-size="28" font-weight="700">&lt; 10 min</text>
    <text x="460" y="65" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="600">Voice-AI Reports</text>

    <rect x="613" y="0" width="280" height="90" rx="10" fill="#132034" stroke="#223552" stroke-width="1"/>
    <text x="633" y="32" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="500">PILOT COMMERCIAL REVENUE</text>
    <text x="633" y="68" fill="#facc15" font-family="sans-serif" font-size="28" font-weight="700">₹ 1.8 Lakh+</text>
    <text x="790" y="65" fill="#94a3b8" font-family="sans-serif" font-size="12">2-Month Pilot</text>

    <rect x="920" y="0" width="280" height="90" rx="10" fill="#132034" stroke="#223552" stroke-width="1"/>
    <text x="940" y="32" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="500">ENGINEERING TEAM</text>
    <text x="940" y="68" fill="#a78bfa" font-family="sans-serif" font-size="28" font-weight="700">4-Member</text>
    <text x="1090" y="65" fill="#94a3b8" font-family="sans-serif" font-size="12">Technical Lead</text>
  </g>

  <!-- Left: Voice AI Intake & Patient Health Record -->
  <g transform="translate(40, 220)">
    <rect x="0" y="0" width="760" height="460" rx="12" fill="#111c2e" stroke="#21334f" stroke-width="1"/>
    <text x="25" y="35" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="600">Voice-AI Clinical Intake & Veterinary Pathology Report</text>
    <text x="25" y="55" fill="#64748b" font-family="sans-serif" font-size="12">Patient: Golden Retriever (Age: 3.5y) · Case #PX-8941 · Status: Ready for Vet Review</text>

    <!-- Voice Recording Panel -->
    <rect x="25" y="75" width="710" height="85" rx="8" fill="#17263c" stroke="#2b3f60" stroke-width="1"/>
    <circle cx="55" cy="117" r="14" fill="#0d9488"/>
    <path d="M 52 110 L 61 117 L 52 124 Z" fill="#fff"/>
    <text x="80" y="108" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">Voice Intake Recording (Pet Parent: 2m 14s)</text>
    
    <!-- Waveform visualization -->
    <path d="M 80 130 Q 120 115 160 130 T 240 140 T 320 120 T 400 135 T 480 118 T 560 132 T 640 122 L 640 130" fill="none" stroke="#2dd4bf" stroke-width="2.5"/>
    <text x="655" y="132" fill="#64748b" font-family="sans-serif" font-size="11">02:14</text>

    <!-- Extracted Clinical Pathology Cards -->
    <g transform="translate(25, 175)">
      <!-- Symptoms Card -->
      <rect x="0" y="0" width="345" height="150" rx="8" fill="#152236" stroke="#243754" stroke-width="1"/>
      <text x="15" y="25" fill="#2dd4bf" font-family="sans-serif" font-size="12" font-weight="600">STRUCTURED SYMPTOMS & DURATION</text>
      <text x="15" y="52" fill="#f1f5f9" font-family="sans-serif" font-size="12">• Chief Complaint: Acute lethargy & reduced appetite</text>
      <text x="15" y="76" fill="#f1f5f9" font-family="sans-serif" font-size="12">• Onset & Duration: 48 hours following outdoor swim</text>
      <text x="15" y="100" fill="#f1f5f9" font-family="sans-serif" font-size="12">• Body Temp: 39.2°C (Mild Pyrexia)</text>
      <text x="15" y="124" fill="#94a3b8" font-family="sans-serif" font-size="11">Prior History: Fully vaccinated (DHPPi, Rabies)</text>

      <!-- RAG Pathology Insights -->
      <rect x="365" y="0" width="345" height="150" rx="8" fill="#152236" stroke="#243754" stroke-width="1"/>
      <text x="380" y="25" fill="#facc15" font-family="sans-serif" font-size="12" font-weight="600">RAG PATHOLOGY DIFFERENTIAL DIAGNOSIS</text>
      <text x="380" y="52" fill="#f1f5f9" font-family="sans-serif" font-size="12">1. Waterborne Gastroenteritis (88% conf)</text>
      <text x="380" y="76" fill="#f1f5f9" font-family="sans-serif" font-size="12">2. Canine Leptospirosis Screening (rec.)</text>
      <text x="380" y="100" fill="#f1f5f9" font-family="sans-serif" font-size="12">3. Recommended Lab: Complete Blood Count (CBC)</text>
      <text x="380" y="124" fill="#34d399" font-family="sans-serif" font-size="11">✓ Pre-Consultation Summary Ready in 8.4 mins</text>
    </g>

    <!-- Bottom Action Ribbon -->
    <g transform="translate(25, 345)">
      <rect x="0" y="0" width="710" height="90" rx="8" fill="#14233a" stroke="#273d61" stroke-width="1"/>
      <text x="20" y="30" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">Automated Clinic Actions</text>
      <text x="20" y="55" fill="#94a3b8" font-family="sans-serif" font-size="11">• Scheduled Follow-up: 22-Sep-2026 11:00 AM • Automated WhatsApp Reminder Sent</text>
      <text x="20" y="73" fill="#94a3b8" font-family="sans-serif" font-size="11">• Centralized Medical Record synced with Clinic ERP database</text>
      <rect x="560" y="25" width="130" height="36" rx="8" fill="#0d9488"/>
      <text x="585" y="48" fill="#fff" font-family="sans-serif" font-size="12" font-weight="600">Approve Report</text>
    </g>
  </g>

  <!-- Right: Architecture & Clinic Management -->
  <g transform="translate(820, 220)">
    <rect x="0" y="0" width="420" height="460" rx="12" fill="#111c2e" stroke="#21334f" stroke-width="1"/>
    <text x="25" y="35" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="600">Platform Tech Architecture</text>

    <!-- Feature 1 -->
    <rect x="25" y="65" width="370" height="75" rx="8" fill="#16243a" stroke="#283e60" stroke-width="1"/>
    <text x="40" y="90" fill="#2dd4bf" font-family="sans-serif" font-size="12" font-weight="600">Voice-AI Streaming Ingestion</text>
    <text x="40" y="110" fill="#94a3b8" font-family="sans-serif" font-size="11">Speech-to-text with veterinary clinical term normalization</text>
    <text x="40" y="128" fill="#38bdf8" font-family="sans-serif" font-size="10">WebSockets audio streaming + LLM extraction</text>

    <!-- Feature 2 -->
    <rect x="25" y="155" width="370" height="75" rx="8" fill="#16243a" stroke="#283e60" stroke-width="1"/>
    <text x="40" y="180" fill="#facc15" font-family="sans-serif" font-size="12" font-weight="600">Veterinary RAG Knowledge Base</text>
    <text x="40" y="200" fill="#94a3b8" font-family="sans-serif" font-size="11">Vector retrieval over veterinary textbooks & drug interaction indexes</text>
    <text x="40" y="218" fill="#34d399" font-family="sans-serif" font-size="10">Sub-second pathology citation synthesis</text>

    <!-- Feature 3 -->
    <rect x="25" y="245" width="370" height="75" rx="8" fill="#16243a" stroke="#283e60" stroke-width="1"/>
    <text x="40" y="270" fill="#a78bfa" font-family="sans-serif" font-size="12" font-weight="600">Clinic CRM & Scheduler Backend</text>
    <text x="40" y="290" fill="#94a3b8" font-family="sans-serif" font-size="11">Appointment queues, medical history records, automated vaccination triggers</text>
    <text x="40" y="308" fill="#6ee7b7" font-family="sans-serif" font-size="10">Built with React, Express, MongoDB, Node.js</text>

    <!-- Feature 4 -->
    <rect x="25" y="335" width="370" height="100" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="40" y="362" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">Clinic Operations & Handoff</text>
    <text x="40" y="388" fill="#94a3b8" font-family="sans-serif" font-size="11">• Production infrastructure serving 1,900+ users</text>
    <text x="40" y="410" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600">• Handed off self-host clinic management operations</text>
  </g>
</svg>

