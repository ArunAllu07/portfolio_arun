  <text x="95" y="66" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">KAHANI KIDS AI | MOBILE &amp; ANALYTICS PLATFORM</text>
  <text x="540" y="65" fill="#94a3b8" font-family="sans-serif" font-size="13">React Native Mobile App · React Admin Analytics Dashboard · Singapore</text>

  <rect x="1070" y="45" width="150" height="30" rx="15" fill="#4c0519" stroke="#be123c" stroke-width="1"/>
