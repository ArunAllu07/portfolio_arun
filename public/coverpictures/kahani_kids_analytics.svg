  <!-- Metrics -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="280" height="90" rx="10" fill="#1b1836" stroke="#2f2b54" stroke-width="1"/>
    <text x="20" y="32" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="500">PLAY STORE INSTALLS</text>
    <text x="20" y="68" fill="#f472b6" font-family="sans-serif" font-size="28" font-weight="700">100,000+</text>
    <text x="170" y="65" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="600">Global Users</text>

    <rect x="306" y="0" width="280" height="90" rx="10" fill="#1b1836" stroke="#2f2b54" stroke-width="1"/>
    <text x="326" y="32" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="500">ANALYTICS MODULES</text>
    <text x="326" y="68" fill="#c084fc" font-family="sans-serif" font-size="28" font-weight="700">5+ Suites</text>
    <text x="460" y="65" fill="#94a3b8" font-family="sans-serif" font-size="12">DAU &amp; Story KPIs</text>

    <rect x="613" y="0" width="280" height="90" rx="10" fill="#1b1836" stroke="#2f2b54" stroke-width="1"/>
    <text x="633" y="32" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="500">BACKEND REST ENDPOINTS</text>
    <text x="633" y="68" fill="#38bdf8" font-family="sans-serif" font-size="28" font-weight="700">20+ APIs</text>
    <text x="750" y="65" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="600">Auth &amp; Stories</text>

    <rect x="920" y="0" width="280" height="90" rx="10" fill="#1b1836" stroke="#2f2b54" stroke-width="1"/>
    <text x="940" y="32" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="500">API COST OPTIMIZATION</text>
    <text x="940" y="68" fill="#34d399" font-family="sans-serif" font-size="28" font-weight="700">-35% Cost</text>
    <text x="1080" y="65" fill="#94a3b8" font-family="sans-serif" font-size="12">Cached Gen</text>
