      <line x1="40" y1="100" x2="640" y2="100" stroke="#2d2852" stroke-width="1"/>
      <line x1="40" y1="150" x2="640" y2="150" stroke="#2d2852" stroke-width="1"/>

      <!-- Path curve -->
      <path d="M 40 140 Q 140 130 240 100 T 440 60 T 640 40 L 640 170 L 40 170 Z" fill="#ec4899" fill-opacity="0.15"/>
      <path d="M 40 140 Q 140 130 240 100 T 440 60 T 640 40" fill="none" stroke="#f472b6" stroke-width="3" filter="url(#glowPink)"/>

