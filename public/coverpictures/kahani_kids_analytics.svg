    <text x="40" y="90" fill="#f472b6" font-family="sans-serif" font-size="12" font-weight="600">10+ React Native App Features</text>
    <text x="40" y="110" fill="#94a3b8" font-family="sans-serif" font-size="11">Interactive story reader, audio narration player, bedtime mode</text>
    <text x="40" y="128" fill="#34d399" font-family="sans-serif" font-size="10">High performance 60fps animations</text>

    <!-- Feature 2 -->
    <rect x="25" y="155" width="370" height="75" rx="8" fill="#1e1b3d" stroke="#373163" stroke-width="1"/>
    <text x="40" y="180" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="600">Content Moderation &amp; Safety</text>
    <text x="40" y="200" fill="#94a3b8" font-family="sans-serif" font-size="11">Automated child-safety filtering and moderation review queue</text>
    <text x="40" y="218" fill="#38bdf8" font-family="sans-serif" font-size="10">COPPA compliant content gates</text>

    <!-- Feature 3 -->
    <rect x="25" y="245" width="370" height="75" rx="8" fill="#1e1b3d" stroke="#373163" stroke-width="1"/>
    <text x="40" y="270" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="600">Community &amp; Sharing Engine</text>
    <text x="40" y="290" fill="#94a3b8" font-family="sans-serif" font-size="11">Parent-to-parent story library, multilingual audio translation</text>
    <text x="40" y="308" fill="#6ee7b7" font-family="sans-serif" font-size="10">Cloud synchronization with REST APIs</text>

    <!-- Feature 4 -->
    <rect x="25" y="335" width="370" height="100" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="40" y="362" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">Production Impact</text>
    <text x="40" y="388" fill="#94a3b8" font-family="sans-serif" font-size="11">• 100K+ Play Store downloads worldwide</text>
    <text x="40" y="410" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600">• Seamless frontend + backend API integration</text>
