      <text x="380" y="25" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="600">THIRD-PARTY API COST AUDITOR</text>
      <text x="380" y="50" fill="#f1f5f9" font-family="sans-serif" font-size="11">• LLM token consumption break-down</text>
      <text x="380" y="70" fill="#f1f5f9" font-family="sans-serif" font-size="11">• Image generation credit optimization</text>
      <text x="380" y="90" fill="#34d399" font-family="sans-serif" font-size="11">✓ Dynamic caching saved $4.2K/mo</text>
