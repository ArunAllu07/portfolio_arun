      <circle cx="440" cy="60" r="4" fill="#fff"/>
      <circle cx="640" cy="40" r="5" fill="#ec4899"/>

      <text x="40" y="185" fill="#64748b" font-family="sans-serif" font-size="10">Day 1</text>
      <text x="240" y="185" fill="#64748b" font-family="sans-serif" font-size="10">Day 10</text>
      <text x="440" y="185" fill="#64748b" font-family="sans-serif" font-size="10">Day 20</text>
      <text x="615" y="185" fill="#64748b" font-family="sans-serif" font-size="10">Day 30 (Peak)</text>
    </g>

