<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#161b2e"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glowPurple">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- Background grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <path d="M 0 100 L 1280 100 M 0 200 L 1280 200 M 0 300 L 1280 300 M 0 400 L 1280 400 M 0 500 L 1280 500 M 0 600 L 1280 600"/>
    <path d="M 200 0 L 200 720 M 400 0 L 400 720 M 600 0 L 600 720 M 800 0 L 800 720 M 1000 0 L 1000 720"/>
  </g>

  <!-- Top Header -->
  <rect x="40" y="30" width="1200" height="60" rx="12" fill="#181f38" stroke="#2c375c" stroke-width="1"/>
  <circle cx="70" cy="60" r="10" fill="#a855f7" filter="url(#glowPurple)"/>
  <text x="95" y="66" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">AGRICULTURAL TELUGU ASR (WHISPER-SMALL)</text>
  <text x="590" y="65" fill="#94a3b8" font-family="sans-serif" font-size="13">Speech Processing Lab · IIIT Hyderabad</text>

  <rect x="1070" y="45" width="150" height="30" rx="15" fill="#3b0764" stroke="#a855f7" stroke-width="1"/>
  <text x="1088" y="65" fill="#f3e8ff" font-family="sans-serif" font-size="12" font-weight="600">Model: Whisper 244M</text>

  <!-- KPI Cards -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="280" height="90" rx="10" fill="#171d33" stroke="#2c375c" stroke-width="1"/>
    <text x="20" y="32" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="500">RELATIVE WER REDUCTION</text>
    <text x="20" y="68" fill="#c084fc" font-family="sans-serif" font-size="28" font-weight="700">72%</text>
    <text x="95" y="65" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="600">↓ from 91.25% baseline</text>

    <rect x="306" y="0" width="280" height="90" rx="10" fill="#171d33" stroke="#2c375c" stroke-width="1"/>
    <text x="326" y="32" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="500">NOISY REAL-FARMER WER</text>
    <text x="326" y="68" fill="#38bdf8" font-family="sans-serif" font-size="28" font-weight="700">24.8%</text>
    <text x="440" y="65" fill="#94a3b8" font-family="sans-serif" font-size="12">385 test samples</text>

    <rect x="613" y="0" width="280" height="90" rx="10" fill="#171d33" stroke="#2c375c" stroke-width="1"/>
    <text x="633" y="32" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="500">CHARACTER ERROR RATE (CER)</text>
    <text x="633" y="68" fill="#f472b6" font-family="sans-serif" font-size="28" font-weight="700">7.1%</text>
    <text x="715" y="65" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="600">High Phoneme Recall</text>

    <rect x="920" y="0" width="280" height="90" rx="10" fill="#171d33" stroke="#2c375c" stroke-width="1"/>
    <text x="940" y="32" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="500">SYNTHESIZED CORPUS</text>
    <text x="940" y="68" fill="#fbbf24" font-family="sans-serif" font-size="28" font-weight="700">3,421</text>
    <text x="1035" y="65" fill="#94a3b8" font-family="sans-serif" font-size="12">Sentences (4.5h TTS)</text>
  </g>

  <!-- Audio Spectrogram & Decoder Panel -->
  <g transform="translate(40, 220)">
    <rect x="0" y="0" width="780" height="460" rx="12" fill="#14182b" stroke="#293354" stroke-width="1"/>
    
    <text x="25" y="35" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="600">Mel-Spectrogram & Two-Phase Decoder Stream (1024 Context)</text>
    <text x="25" y="55" fill="#64748b" font-family="sans-serif" font-size="12">Domain-Adapted Multi-Speaker Agricultural Telephony Audio</text>

    <!-- Spectrogram Visual Bars -->
    <g transform="translate(40, 80)">
      <!-- Simulated Mel Spectrogram heatmap rows -->
      <rect x="0" y="0" width="700" height="150" rx="8" fill="#0b0e1b"/>
      <!-- Waveform overlay path -->
      <path d="M 0 75 Q 30 10 60 75 T 120 120 T 180 30 T 240 100 T 300 45 T 360 115 T 420 20 T 480 90 T 540 50 T 600 110 T 660 65 T 700 75 L 700 150 L 0 150 Z" fill="url(#waveGrad)"/>
      <path d="M 0 75 Q 30 10 60 75 T 120 120 T 180 30 T 240 100 T 300 45 T 360 115 T 420 20 T 480 90 T 540 50 T 600 110 T 660 65 T 700 75" fill="none" stroke="#c084fc" stroke-width="2.5" filter="url(#glowPurple)"/>

      <!-- Audio timeline ticks -->
      <line x1="100" y1="130" x2="100" y2="145" stroke="#475569" stroke-width="1"/>
      <line x1="250" y1="130" x2="250" y2="145" stroke="#475569" stroke-width="1"/>
      <line x1="400" y1="130" x2="400" y2="145" stroke="#475569" stroke-width="1"/>
      <line x1="550" y1="130" x2="550" y2="145" stroke="#475569" stroke-width="1"/>
      <text x="90" y="142" fill="#64748b" font-family="sans-serif" font-size="9">1.2s</text>
      <text x="240" y="142" fill="#64748b" font-family="sans-serif" font-size="9">2.8s</text>
      <text x="390" y="142" fill="#64748b" font-family="sans-serif" font-size="9">4.5s</text>
      <text x="540" y="142" fill="#64748b" font-family="sans-serif" font-size="9">6.1s</text>
    </g>

    <!-- Telugu Transcription Stream Output Box -->
    <rect x="40" y="255" width="700" height="175" rx="10" fill="#0d1122" stroke="#252d47" stroke-width="1"/>
    <text x="60" y="285" fill="#a855f7" font-family="sans-serif" font-size="12" font-weight="600">DECODED ASR STREAM (TELUGU CROP ADVISORY)</text>

    <!-- Predicted text in Telugu font -->
    <text x="60" y="325" fill="#f8fafc" font-family="'Noto Sans Telugu', 'Segoe UI', sans-serif" font-size="18" font-weight="500">
      "వరి పంటలో కాండం తొలిచే పురుగు నివారణకు ఎకరానికి క్లోరాంట్రానిలిప్రోల్ మందు పిచికారీ చేయాలి"
    </text>
    <text x="60" y="360" fill="#94a3b8" font-family="sans-serif" font-size="12">
      English: "For stem borer control in paddy crop, spray chlorantraniliprole formulation per acre."
    </text>

    <!-- Token Probability Badges -->
    <g transform="translate(60, 385)">
      <rect x="0" y="0" width="110" height="24" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
      <text x="12" y="16" fill="#a5b4fc" font-family="sans-serif" font-size="10">P(Token) = 0.984</text>

      <rect x="120" y="0" width="140" height="24" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text x="132" y="16" fill="#6ee7b7" font-family="sans-serif" font-size="10">Decoder Tokens: 1,024</text>

      <rect x="270" y="0" width="130" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="282" y="16" fill="#cbd5e1" font-family="sans-serif" font-size="10">Language: Telugu (te)</text>
    </g>
  </g>

  <!-- Right Panel: 7-Stage Augmentation Pipeline -->
  <g transform="translate(840, 220)">
    <rect x="0" y="0" width="400" height="460" rx="12" fill="#14182b" stroke="#293354" stroke-width="1"/>
    <text x="25" y="35" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="600">7-Stage Augmentation Pipeline</text>

    <!-- Pipeline Step 1 -->
    <rect x="25" y="65" width="350" height="45" rx="8" fill="#1a2038" stroke="#374151" stroke-width="1"/>
    <circle cx="45" cy="87" r="10" fill="#8b5cf6"/>
    <text x="42" y="91" fill="#fff" font-family="sans-serif" font-size="10" font-weight="700">1</text>
    <text x="65" y="84" fill="#f1f5f9" font-family="sans-serif" font-size="12" font-weight="600">MUSAN Noise Addition</text>
    <text x="65" y="99" fill="#94a3b8" font-family="sans-serif" font-size="10">SNR 5-15 dB background field babble</text>

    <!-- Pipeline Step 2 -->
    <rect x="25" y="120" width="350" height="45" rx="8" fill="#1a2038" stroke="#374151" stroke-width="1"/>
    <circle cx="45" cy="142" r="10" fill="#a855f7"/>
    <text x="42" y="146" fill="#fff" font-family="sans-serif" font-size="10" font-weight="700">2</text>
    <text x="65" y="139" fill="#f1f5f9" font-family="sans-serif" font-size="12" font-weight="600">RIR Room Impulse Reverberation</text>
    <text x="65" y="154" fill="#94a3b8" font-family="sans-serif" font-size="10">Simulated rural outdoor reflections</text>

    <!-- Pipeline Step 3 -->
    <rect x="25" y="175" width="350" height="45" rx="8" fill="#1a2038" stroke="#374151" stroke-width="1"/>
    <circle cx="45" cy="197" r="10" fill="#c084fc"/>
    <text x="42" y="201" fill="#fff" font-family="sans-serif" font-size="10" font-weight="700">3</text>
    <text x="65" y="194" fill="#f1f5f9" font-family="sans-serif" font-size="12" font-weight="600">SpecAugment Time/Freq Masking</text>
    <text x="65" y="209" fill="#94a3b8" font-family="sans-serif" font-size="10">F=27, T=100 spectrogram zero-masking</text>

    <!-- Pipeline Step 4 -->
    <rect x="25" y="230" width="350" height="45" rx="8" fill="#1a2038" stroke="#374151" stroke-width="1"/>
    <circle cx="45" cy="252" r="10" fill="#ec4899"/>
    <text x="42" y="256" fill="#fff" font-family="sans-serif" font-size="10" font-weight="700">4</text>
    <text x="65" y="249" fill="#f1f5f9" font-family="sans-serif" font-size="12" font-weight="600">Telephony Codec Simulation</text>
    <text x="65" y="264" fill="#94a3b8" font-family="sans-serif" font-size="10">8kHz AMR-NB / GSM compression</text>

    <!-- Benchmark Comparison -->
    <rect x="25" y="295" width="350" height="140" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="40" y="325" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">WER Benchmark Summary</text>
    
    <text x="40" y="355" fill="#ef4444" font-family="sans-serif" font-size="12">Baseline Whisper: 91.25% WER</text>
    <text x="40" y="380" fill="#f59e0b" font-family="sans-serif" font-size="12">Phase 1 SFT: 44.3% WER</text>
    <text x="40" y="405" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="700">Phase 2 Augmented: 24.8% WER (-72%)</text>
  </g>
</svg>

