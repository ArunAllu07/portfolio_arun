<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e14"/>
      <stop offset="100%" stop-color="#141924"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- Subtle Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M 0 120 L 1280 120 M 0 240 L 1280 240 M 0 360 L 1280 360 M 0 480 L 1280 480 M 0 600 L 1280 600"/>
    <path d="M 160 0 L 160 720 M 320 0 L 320 720 M 480 0 L 480 720 M 640 0 L 640 720 M 800 0 L 800 720 M 960 0 L 960 720 M 1120 0 L 1120 720"/>
  </g>

  <!-- Header / Navigation Bar -->
  <rect x="40" y="30" width="1200" height="60" rx="12" fill="#171d2b" stroke="#2a3449" stroke-width="1"/>
  <circle cx="70" cy="60" r="10" fill="#06b6d4" filter="url(#glow)"/>
  <text x="95" y="66" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">EV BATTERY SOC ESTIMATOR</text>
  <text x="360" y="65" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">BMW i3 Telemetry (32 Urban/Highway Trips)</text>

  <rect x="1060" y="45" width="160" height="30" rx="15" fill="#0c4a6e" stroke="#0284c7" stroke-width="1"/>
  <circle cx="1078" cy="60" r="4" fill="#38bdf8"/>
  <text x="1090" y="65" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Model: PyTorch Transformer</text>

  <!-- Metric KPI Cards Top -->
  <g transform="translate(40, 110)">
    <!-- KPI 1 -->
    <rect x="0" y="0" width="280" height="90" rx="10" fill="#151b28" stroke="#253046" stroke-width="1"/>
    <text x="20" y="32" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="500">CORRELATION METRIC (R²)</text>
    <text x="20" y="68" fill="#38bdf8" font-family="sans-serif" font-size="28" font-weight="700">0.9985</text>
    <text x="140" y="65" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="600">↑ 99.85% fit</text>

    <!-- KPI 2 -->
    <rect x="306" y="0" width="280" height="90" rx="10" fill="#151b28" stroke="#253046" stroke-width="1"/>
    <text x="326" y="32" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="500">RANDOM FOREST TEST RMSE</text>
    <text x="326" y="68" fill="#34d399" font-family="sans-serif" font-size="28" font-weight="700">0.2328%</text>
    <text x="470" y="65" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="600">300 Trees (PCA)</text>

    <!-- KPI 3 -->
    <rect x="613" y="0" width="280" height="90" rx="10" fill="#151b28" stroke="#253046" stroke-width="1"/>
    <text x="633" y="32" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="500">BiLSTM / ENCODER RMSE</text>
    <text x="633" y="68" fill="#a78bfa" font-family="sans-serif" font-size="28" font-weight="700">0.44%</text>
    <text x="740" y="65" fill="#94a3b8" font-family="sans-serif" font-size="12">Sliding Window 30/60</text>

    <!-- KPI 4 -->
    <rect x="920" y="0" width="280" height="90" rx="10" fill="#151b28" stroke="#253046" stroke-width="1"/>
    <text x="940" y="32" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="500">FEATURE PIPELINE</text>
    <text x="940" y="68" fill="#f59e0b" font-family="sans-serif" font-size="28" font-weight="700">15 Signals</text>
    <text x="1075" y="65" fill="#94a3b8" font-family="sans-serif" font-size="12">Power, dV/dt, dI/dt</text>
  </g>

  <!-- Main Chart: SOC Prediction vs Ground Truth -->
  <g transform="translate(40, 220)">
    <rect x="0" y="0" width="880" height="460" rx="12" fill="#131924" stroke="#253046" stroke-width="1"/>
    <text x="25" y="35" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="600">Real-Time State of Charge Discharge Curve (Drive Cycle #14)</text>
    <text x="25" y="55" fill="#64748b" font-family="sans-serif" font-size="12">Ground Truth vs PyTorch Transformer vs BiLSTM</text>

    <!-- Legend -->
    <g transform="translate(560, 25)">
      <line x1="0" y1="10" x2="25" y2="10" stroke="#94a3b8" stroke-dasharray="4" stroke-width="2"/>
      <text x="32" y="14" fill="#94a3b8" font-family="sans-serif" font-size="11">Ground Truth</text>

      <line x1="120" y1="10" x2="145" y2="10" stroke="#06b6d4" stroke-width="2.5"/>
      <text x="152" y="14" fill="#06b6d4" font-family="sans-serif" font-size="11">Transformer</text>

      <line x1="240" y1="10" x2="265" y2="10" stroke="#10b981" stroke-width="2"/>
      <text x="272" y="14" fill="#10b981" font-family="sans-serif" font-size="11">BiLSTM</text>
    </g>

    <!-- Chart Grid Lines -->
    <g stroke="#222b3d" stroke-width="1">
      <line x1="60" y1="90" x2="840" y2="90"/>
      <line x1="60" y1="160" x2="840" y2="160"/>
      <line x1="60" y1="230" x2="840" y2="230"/>
      <line x1="60" y1="300" x2="840" y2="300"/>
      <line x1="60" y1="370" x2="840" y2="370"/>
    </g>

    <!-- Y-Axis Labels -->
    <text x="25" y="94" fill="#64748b" font-family="sans-serif" font-size="11">100%</text>
    <text x="30" y="164" fill="#64748b" font-family="sans-serif" font-size="11">80%</text>
    <text x="30" y="234" fill="#64748b" font-family="sans-serif" font-size="11">60%</text>
    <text x="30" y="304" fill="#64748b" font-family="sans-serif" font-size="11">40%</text>
    <text x="30" y="374" fill="#64748b" font-family="sans-serif" font-size="11">20%</text>

    <!-- Area Under Curve -->
    <path d="M 60 100 Q 200 130 350 200 T 600 300 T 840 360 L 840 410 L 60 410 Z" fill="url(#glowGrad)"/>

    <!-- Curves -->
    <!-- Ground Truth (Dashed) -->
    <path d="M 60 100 Q 200 130 350 200 T 600 300 T 840 360" fill="none" stroke="#94a3b8" stroke-dasharray="5 4" stroke-width="2"/>
    <!-- Transformer (Cyan) -->
    <path d="M 60 99 Q 200 128 350 198 T 600 298 T 840 359" fill="none" stroke="#06b6d4" stroke-width="3" filter="url(#glow)"/>
    <!-- BiLSTM (Green) -->
    <path d="M 60 102 Q 200 133 350 203 T 600 302 T 840 363" fill="none" stroke="#10b981" stroke-width="2"/>

    <!-- Dynamic Pulse Point -->
    <circle cx="500" cy="265" r="5" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="500" cy="265" r="10" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Annotation Tooltip -->
    <rect x="520" y="235" width="160" height="50" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="532" y="254" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">Estimated SOC: 54.2%</text>
    <text x="532" y="272" fill="#34d399" font-family="sans-serif" font-size="10">Δ True: 0.12% error</text>

    <!-- X Axis labels -->
    <text x="60" y="430" fill="#64748b" font-family="sans-serif" font-size="11">0 min</text>
    <text x="250" y="430" fill="#64748b" font-family="sans-serif" font-size="11">15 min</text>
    <text x="450" y="430" fill="#64748b" font-family="sans-serif" font-size="11">30 min</text>
    <text x="650" y="430" fill="#64748b" font-family="sans-serif" font-size="11">45 min</text>
    <text x="815" y="430" fill="#64748b" font-family="sans-serif" font-size="11">60 min</text>
  </g>

  <!-- Right Panel: Feature Importance & PCA -->
  <g transform="translate(940, 220)">
    <rect x="0" y="0" width="300" height="460" rx="12" fill="#131924" stroke="#253046" stroke-width="1"/>
    <text x="20" y="35" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="600">Feature Importance (PCA)</text>

    <!-- Feature 1 -->
    <text x="20" y="80" fill="#94a3b8" font-family="sans-serif" font-size="12">Cumulative Current (Ah)</text>
    <rect x="20" y="90" width="260" height="8" rx="4" fill="#1e293b"/>
    <rect x="20" y="90" width="235" height="8" rx="4" fill="url(#cyanGrad)"/>
    <text x="245" y="80" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">92%</text>

    <!-- Feature 2 -->
    <text x="20" y="130" fill="#94a3b8" font-family="sans-serif" font-size="12">Instantaneous Power (kW)</text>
    <rect x="20" y="140" width="260" height="8" rx="4" fill="#1e293b"/>
    <rect x="20" y="140" width="200" height="8" rx="4" fill="url(#cyanGrad)"/>
    <text x="245" y="130" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">78%</text>

    <!-- Feature 3 -->
    <text x="20" y="180" fill="#94a3b8" font-family="sans-serif" font-size="12">Voltage Gradient (dV/dt)</text>
    <rect x="20" y="190" width="260" height="8" rx="4" fill="#1e293b"/>
    <rect x="20" y="190" width="175" height="8" rx="4" fill="url(#cyanGrad)"/>
    <text x="245" y="180" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">68%</text>

    <!-- Feature 4 -->
    <text x="20" y="230" fill="#94a3b8" font-family="sans-serif" font-size="12">Battery Temp Gradient</text>
    <rect x="20" y="240" width="260" height="8" rx="4" fill="#1e293b"/>
    <rect x="20" y="240" width="140" height="8" rx="4" fill="url(#cyanGrad)"/>
    <text x="245" y="230" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">54%</text>

    <!-- Model Stats Box -->
    <rect x="20" y="280" width="260" height="155" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="35" y="310" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">Architecture Specs</text>
    
    <text x="35" y="338" fill="#94a3b8" font-family="sans-serif" font-size="11">• 4-layer Transformer Encoder</text>
    <text x="35" y="360" fill="#94a3b8" font-family="sans-serif" font-size="11">• 2-layer BiLSTM (128 hidden)</text>
    <text x="35" y="382" fill="#94a3b8" font-family="sans-serif" font-size="11">• 32 BMW i3 Drive Cycles</text>
    <text x="35" y="404" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600">• MATLAB RF: 0.2328% RMSE</text>
  </g>
</svg>

